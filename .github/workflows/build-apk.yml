      - name: Download Gradle
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
      - name: Build APK
        working-directory: app-src
        run: ../gradle-8.9/bin/gradle assembleRelease --no-daemon --stacktrace
      - name: Save APK
        uses: actions/upload-artifact@v5
        with:
          name: BeaconNotes-APK
          path: app-src/app/build/outputs/apk/release/app-release.apk
